[package]
name = "theater_shared"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

# What Theater Scene and Theater Reader (repos Theater-Scene, Theater-Reader) both use. A plain
# library: each plugin builds its own copy in.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
egui = "0.31"
