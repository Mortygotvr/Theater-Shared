[package]
name = "theater_shared"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

# What Theater Scene and Theater Reader (repos Theater-Scene, Theater-Reader) both use. A plain
# library: each plugin builds its own copy in.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
egui = "0.31"

# The relay (relay.rs, obs_link.rs), for the plugins that send through it
# (Theater Reader, Theater API): not Theater Scene, which only listens.
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"], optional = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"], optional = true }
futures-util = { version = "0.3", optional = true }

[features]
relay = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
